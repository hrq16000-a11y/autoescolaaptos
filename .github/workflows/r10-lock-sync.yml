name: R10 Nitro lockfile sync (temporary)
on:
  pull_request:
    paths:
      - 'migration/tanstack/package.json'
      - '.github/workflows/r10-lock-sync.yml'
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/aptos-r10-nitro-vercel-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update only TanStack npm lockfile
        run: npm install --prefix migration/tanstack --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          git add migration/tanstack/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(tanstack): lock nitro dependency'
            git push origin HEAD:fix/aptos-r10-nitro-vercel-adapter
          fi
