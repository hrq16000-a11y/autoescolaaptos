name: Deploy APTOS admin-optin
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-optin/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-admin-optin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aptos-admin-optin-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy authenticated admin function from GitHub
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not configured; deployment blocked."
            exit 1
          fi
          supabase functions deploy admin-optin --project-ref jbvepseodqytqxxckgtu --no-verify-jwt
      - name: Verify deployed API rejects unauthenticated request
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 18 --output /dev/null --write-out '%{http_code}' 'https://jbvepseodqytqxxckgtu.supabase.co/functions/v1/admin-optin?action=metrics')"
          echo "Admin endpoint unauthenticated HTTP: $status"
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            echo "::error::Unexpected admin endpoint status $status after deploy"
            exit 1
          fi
