name: Production smoke - Autoescola APTOS
on:
  push:
    branches: [main]
    paths:
      - 'public/deploy-check.json'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: aptos-production-smoke
  cancel-in-progress: true

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for published release marker
        shell: bash
        env:
          SITE_URL: https://autoescolaaptos.com.br
        run: |
          set -euo pipefail
          expected="$(jq -r '.release' public/deploy-check.json)"
          if [[ -z "$expected" || "$expected" == "null" ]]; then
            echo "::error::Invalid repository release marker"
            exit 1
          fi
          for attempt in $(seq 1 20); do
            body="$(curl -fsSL --retry 1 --max-time 15 -H 'Cache-Control: no-cache' "$SITE_URL/deploy-check.json?check=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            if jq -e --arg release "$expected" '.release == $release and .project == "autoescolaaptos"' <<<"$body" > /dev/null 2>&1; then
              echo "Confirmed production release marker: $expected"
              exit 0
            fi
            echo "Release marker not deployed yet (attempt $attempt/20)"
            sleep 20
          done
          echo "::error::Expected release marker not found on official domain after waiting"
          exit 1
      - name: Verify public pages and SEO entry points
        shell: bash
        run: |
          set -euo pipefail
          site='https://autoescolaaptos.com.br'
          curl -fsSL --max-time 20 "$site/" -o home.html
          grep -Eiq '<title>[^<]*APTOS' home.html
          grep -Eq 'rel="canonical"[^>]*href="https://autoescolaaptos.com.br/"' home.html
          grep -q '<div id="root"></div>' home.html
          curl -fsSL --max-time 20 "$site/robots.txt" -o robots.txt
          grep -q 'Sitemap: https://autoescolaaptos.com.br/sitemap.xml' robots.txt
          curl -fsSL --max-time 20 "$site/sitemap.xml" -o sitemap.xml
          grep -q '<loc>https://autoescolaaptos.com.br/orcamento</loc>' sitemap.xml
          grep -q '<loc>https://autoescolaaptos.com.br/carro-automatico</loc>' sitemap.xml
          for route in /orcamento /primeira-habilitacao /carro-automatico; do
            curl -fsSL --max-time 20 "$site$route" -o /dev/null
            echo "HTTP OK: $route"
          done
          echo 'Production HTTP and SEO entry points OK'
