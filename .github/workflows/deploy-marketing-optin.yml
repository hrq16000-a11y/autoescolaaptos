name: Deploy marketing opt-in function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/marketing-optin/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-marketing-optin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aptos-marketing-optin-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: jbvepseodqytqxxckgtu
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy marketing-optin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions secrets"
            exit 1
          fi
          supabase functions deploy marketing-optin \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Record deployed function
        run: echo "marketing-optin deployed for project ${SUPABASE_PROJECT_REF}"
