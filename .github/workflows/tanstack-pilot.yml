name: TanStack pilot
on:
  push:
    paths: ['migration/tanstack/**', '.github/workflows/tanstack-pilot.yml']
  pull_request:
    paths: ['migration/tanstack/**', '.github/workflows/tanstack-pilot.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: migration/tanstack/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix migration/tanstack --no-audit --no-fund
      - run: npm run build --prefix migration/tanstack
      - run: npm run typecheck --prefix migration/tanstack
      - run: npm run check:ssr --prefix migration/tanstack
      - run: npm run check:preview --prefix migration/tanstack
      - run: ./migration/tanstack/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:browser --prefix migration/tanstack
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tanstack-visual-evidence
          path: migration/tanstack/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tanstack-browser-failures
          path: |
            migration/tanstack/playwright-report
            migration/tanstack/test-results
          retention-days: 7
