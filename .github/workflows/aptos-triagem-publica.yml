name: APTOS - triagem em navegador no dominio oficial
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aptos-triagem-publica.yml'
      - 'scripts/test-public-triage.cjs'
      - 'scripts/test-public-visual.cjs'
      - 'scripts/test-public-navbar.cjs'
      - 'scripts/test-public-home-funnel.cjs'
      - 'scripts/test-public-service-links.cjs'
      - 'scripts/test-public-orcamento.cjs'
      - 'src/pages/Orcamento.tsx'
      - 'src/components/Services.tsx'
      - 'src/components/Navbar.tsx'
      - 'src/pages/CarroAutomatico.tsx'
      - 'src/pages/AulasPraticasDirecao.tsx'
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar navegador de teste isolado
        run: |
          npm install --prefix /tmp/aptos-smoke --no-save --no-package-lock playwright@1.56.1
          /tmp/aptos-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Validar os dois pop-ups publicados sem enviar mensagens
        env:
          NODE_PATH: /tmp/aptos-smoke/node_modules
        run: node scripts/test-public-triage.cjs
      - name: Validar fotos oficiais em celular e desktop
        env:
          NODE_PATH: /tmp/aptos-smoke/node_modules
        run: node scripts/test-public-visual.cjs
      - name: Validar menu mobile em navegador real
        env:
          NODE_PATH: /tmp/aptos-smoke/node_modules
        run: node scripts/test-public-navbar.cjs
      - name: Validar funil de Primeira Habilitacao na home
        env:
          NODE_PATH: /tmp/aptos-smoke/node_modules
        run: node scripts/test-public-home-funnel.cjs
      - name: Validar links e WhatsApp dos demais servicos
        env:
          NODE_PATH: /tmp/aptos-smoke/node_modules
        run: node scripts/test-public-service-links.cjs
      - name: Validar revisao do orcamento publico
        env:
          NODE_PATH: /tmp/aptos-smoke/node_modules
        run: node scripts/test-public-orcamento.cjs
      - name: Guardar evidencias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aptos-visual-publico
          path: artifacts/aptos-visual/
          if-no-files-found: ignore
          retention-days: 7
