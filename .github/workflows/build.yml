name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        command: [build, 'build:standalone']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-triagem-safety.mjs
      - run: node scripts/test-safe-next.mjs
      - run: npm run ${{ matrix.command }}

  rpc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aptos_local_test
          POSTGRES_PASSWORD: aptos_ci_ephemeral
          POSTGRES_DB: aptos_local_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aptos_local_test -d aptos_local_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: aptos_local_test
      PGPASSWORD: aptos_ci_ephemeral
      PGDATABASE: aptos_local_test
    steps:
      - uses: actions/checkout@v4
      - name: Exercise checked-in triage RPC in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-triagem-rpc.sql
